name: Build APK
on:
  workflow_dispatch:
  push:
    paths: ['android/**', '.github/workflows/apk.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Build debug APK
        working-directory: android
        run: set -o pipefail; gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee ../build-log.txt
      - name: Save log (send this file to Claude if the build fails)
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: build-log, path: build-log.txt }
      - uses: actions/upload-artifact@v4
        with: { name: Jarvis-apk, path: android/app/build/outputs/apk/debug/app-debug.apk }
