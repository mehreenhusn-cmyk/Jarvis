<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="google" content="notranslate"><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#0e1116">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jarvis</title>
<style>
:root{--bg:#0e1116;--sf:#161b22;--sf2:#1d242d;--fg:#e6e9ee;--mut:#8b95a3;--ac:#c9a45c;--acd:#2a2417;--me:#233044;--line:#262e38;--ok:#4fb27a;--bad:#e5655f;color-scheme:dark light}
@media(prefers-color-scheme:light){:root{--bg:#f6f4ef;--sf:#fff;--sf2:#efece5;--fg:#1c2128;--mut:#6b7480;--ac:#8a6a21;--acd:#f3ead4;--me:#e3ebf6;--line:#dcd8cd;--ok:#2e8a57;--bad:#c94741}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 "Segoe UI",Roboto,system-ui,sans-serif;height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--sf);border-bottom:1px solid var(--line)}
.logo{width:34px;height:34px;border-radius:50%;border:2px solid var(--ac);display:grid;place-items:center;color:var(--ac);font-weight:700}
header b{font-size:17px;letter-spacing:.14em}#st{font-size:12px;color:var(--mut);display:block;letter-spacing:0}.ok{color:var(--ok)}.warn{color:var(--ac)}.bad{color:var(--bad)}
.sp{flex:1}#gear,#vbtn{width:40px;height:40px;padding:0;border-radius:50%;background:var(--sf2);color:var(--fg);font-size:18px}
button{padding:11px 16px;border:0;border-radius:12px;background:var(--ac);color:#15120a;font:600 15px inherit;cursor:pointer}
button.g{background:var(--sf2);color:var(--fg);padding:8px 12px;font-size:14px;font-weight:500}
input,select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--sf);color:var(--fg);font-size:16px}
select{width:auto;max-width:100%;padding:8px 10px;font-size:14px}
#pair{padding:32px 22px;max-width:420px;margin:auto;text-align:center}#pair h2{font-weight:600;margin:.2em 0}#pair p{color:var(--mut)}#pair input{text-align:center;letter-spacing:.4em;font-size:22px}
#chat{flex:1;display:flex;flex-direction:column;min-height:0}#chat[hidden],#pair[hidden],#set[hidden],#vp[hidden]{display:none}
#pv{padding:6px 16px;font-size:12px;color:var(--mut);background:var(--sf);border-bottom:1px solid var(--line)}
#vp{padding:12px 16px;background:var(--sf);border-bottom:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:14px;color:var(--mut)}
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.m{max-width:86%;padding:11px 14px;border-radius:16px 16px 16px 4px;background:var(--sf);border:1px solid var(--line);white-space:pre-wrap;word-wrap:break-word}
.m.user{align-self:flex-end;background:var(--me);border-color:transparent;border-radius:16px 16px 4px 16px}.m.err{color:var(--bad)}
form{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--sf);border-top:1px solid var(--line);align-items:center}
form input{border-radius:24px}#mic{width:52px;height:52px;padding:0;border-radius:50%;font-size:22px;flex:none}#send{border-radius:24px}
#stop{width:40px;height:40px;padding:0;border-radius:50%;background:var(--sf2);color:var(--bad);flex:none}
#set{flex:1;overflow-y:auto;padding:18px 16px}#set h4{margin:22px 0 8px;color:var(--ac);font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.card{background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kr{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 0;justify-content:space-between}
.bar{height:8px;border-radius:4px;background:var(--sf2);overflow:hidden;flex:1;min-width:80px}.bar i{display:block;height:100%;background:var(--ok)}.bar i.w{background:var(--ac)}.bar i.b{background:var(--bad)}
.dr{padding:9px 0;border-top:1px solid var(--line)}.dr small{display:block;color:var(--mut);font-size:12px}.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:10px;background:var(--sf2);margin:4px 6px 0 0}
</style></head><body>
<header><div class="logo">J</div><div><b>JARVIS</b><span id="st">...</span></div><span class="sp"></span><button id="vbtn" title="Voice">🔊</button><button id="gear" title="Settings">⚙</button></header>
<div id="pair"><h2>Welcome, sir</h2><p>Enter the 6-digit pairing code shown in Termux.</p>
<input id="code" inputmode="numeric" maxlength="6" placeholder="••••••"><p><button id="go">Pair this phone</button></p><p id="pe" class="bad"></p></div>
<div id="set" hidden><h4>System</h4><div class="card" id="sys"></div><h4>Privacy and permissions</h4><div class="card" id="dash"></div><h4>API key</h4><div class="card"><p style="margin-top:0;color:var(--mut)">Paste a key. Jarvis finds the company and checks it.</p>
<input id="key" placeholder="Paste key here" autocomplete="off"><p><button id="kp">Paste from clipboard</button> <button id="kc" class="g">Check</button></p><p id="kr"></p><div id="kl"></div></div>
<h4>People</h4><div class="card" id="pl"></div><h4>Memory</h4><div class="card" id="ml"></div><h4>Money ledger</h4><div class="card" id="ll"></div></div>
<div id="off" class="bad" hidden style="padding:8px 16px;font-size:13px;background:var(--sf);border-bottom:1px solid var(--line)"></div><div id="pv"></div><div id="chat" hidden>
<div id="vp" hidden><select id="lang"><option value="hi-IN">Speak: Hindi</option><option value="en-IN">Speak: English</option></select>
<select id="voice"></select><select id="pre"><option value="">Voice style</option><option value="k">Khattar (deep, Hindi dub)</option><option value="r">Rolex (very deep)</option><option value="d">Jarvis studio (Hindi)</option><option value="b">Jarvis studio (British English)</option><option value="n">Normal</option></select>
<label><input type="checkbox" id="say" style="width:auto"> Speak replies</label><label>Depth <input type="range" id="pt" min="0.5" max="1.5" step="0.05" style="width:80px;padding:0"></label><label>Speed <input type="range" id="rt" min="0.6" max="1.4" step="0.05" style="width:80px;padding:0"></label>
<button type="button" id="tv" class="g">Test voice</button><button type="button" id="mon" class="g" hidden>Turn mic on</button><button type="button" id="wake" class="g" hidden>Hey Jarvis: off</button><b id="ms" class="ok">Mic off</b></div>
<div id="log"></div>
<form id="f"><button type="button" id="stop" title="Stop">⏹</button><input id="msg" autocomplete="off" placeholder="Message Jarvis..."><button id="send">Send</button><button type="button" id="cam" title="Camera" class="g" style="width:44px;height:44px;border-radius:50%;padding:0;flex:none">📷</button><button type="button" id="mic" title="Speak">🎤</button><input type="file" id="pic" accept="image/*" capture="environment" hidden></form></div>
<script>
const $=id=>document.getElementById(id);
let token=localStorage.getItem('jtoken')||'';
async function api(path,body){
  const h={'Content-Type':'application/json'};if(token)h.Authorization='Bearer '+token;
  const r=await fetch(path,{method:body?'POST':'GET',headers:h,body:body?JSON.stringify(body):undefined});
  let d={};try{d=await r.json()}catch(e){}
  return {s:r.status,d};
}
function add(role,text){const m=document.createElement('div');m.className='m '+role;m.textContent=text;$('log').appendChild(m);m.scrollIntoView();return m;}
function show(){$('pair').hidden=!!token;$('chat').hidden=!token;if(!token)$('set').hidden=true;}
let boot='';
const nowS=()=>new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16).replace('T',' ');
async function checkDue(){
  try{const {s,d}=await api('/due',{now:nowS()});
    if(s==200)(d.due||[]).forEach(r=>{const t='⏰ Reminder: '+r.text;add('bot',t);speak(t,true);if(navigator.vibrate)navigator.vibrate([300,150,300]);});
  }catch(e){}
}
let down=0,since='',srvUp=0;
async function ping(){
  try{const {d}=await api('/status');
    if(boot&&d.boot&&d.boot!==boot){location.reload();return;}boot=d.boot||boot;down=0;srvUp=d.uptime||0;$('off').hidden=true;
    $('st').textContent=(d.configured?'● Online':'● Online · no API key yet')+(d.sync?' · Update: '+d.sync.split('|').join(' · '):'');$('st').className=d.configured?'ok':'warn';
  }catch(e){if(!down++)since=nowS().slice(11);$('st').textContent='● Server offline';$('st').className='bad';srvUp=0;
    if(down>=2){$('off').hidden=false;$('off').textContent='Jarvis server is not running (since '+since+'). Open the Termux app and wait 5 seconds. I keep trying every 5 seconds.';}}
}
async function history(){
  $('log').textContent='';
  try{const {s,d}=await api('/history');if(s==200)d.messages.forEach(m=>add(m.role,m.content));}catch(e){}
}
$('go').onclick=async()=>{
  try{const {s,d}=await api('/pair',{code:$('code').value.trim(),name:'phone browser'});
    if(s==200){token=d.token;localStorage.setItem('jtoken',token);if(window.JarvisApp)JarvisApp.saveToken(token);show();history();}else $('pe').textContent=d.error||'Pairing failed';
  }catch(e){$('pe').textContent='Cannot reach the server. Is Jarvis running in Termux?';}
};
$('f').onsubmit=async e=>{
  e.preventDefault();const t=$('msg').value.trim();if(!t)return;$('msg').value='';
  if(/^(gsk_|sk-or-|nvapi-|mstrl_|sk-[0-9a-f]{32}$)/.test(t)){$('set').hidden=false;$('chat').hidden=true;$('key').value=t;addKey();return;}
  if(/stop listening|stop everything|mic band|sunna band|सुनना बंद|माइक बंद/i.test(t)){add('user',t);add('bot',stopAll());return;}
  if(SCREENQ.test(t)&&!screenData){const r=sbridge();
    if(!r){add('user',t);add('err','Screen reading works only in the Jarvis Android app.');return;}
    if(r.stopped){add('user',t);add('err','Jarvis is stopped. Tap "Turn mic on" first.');return;}
    if(r.perm===false){add('user',t);add('bot','Turn on "Jarvis screen reader" in Accessibility settings (I opened it for you), then ask again.');return;}
    pendingMsg=t;add('bot','Switch to the app you want me to read. I will read it in '+r.wait+' seconds and come back.');return;}
  const sc=screenData;screenData=null;const vm=viaMic;viaMic=false;add('user',t);const w=add('bot','...');
  let sp=false;try{const loc=WHERE.test(t)?await getLoc():null;const {s,d}=await api('/chat',{message:t,now:nowS(),style:sty(),loc,phone:SLOW.test(t)?pinfo():null,calls:CALLQ.test(t)?bridge('calls',/today|aaj|आज/i.test(t)?1:/week/i.test(t)?7:3):null,contact:CNQ.test(t)?bridge('contact',t.match(CNQ)[1]):null,screen:sc,app:inApp(),control:inApp()&&ctl()});
    if(s==401){token='';localStorage.removeItem('jtoken');show();return;}
    if(s==200){w.textContent=d.reply;w.title='via '+d.via;speak(d.action?await doAct(d.action,w):d.reply,vm);sp=vm||$('say').checked;}else{w.className='m err';w.textContent=d.error||'error';}
  }catch(e){w.className='m err';w.textContent='Cannot reach the server.';}finally{if(wakeOn&&!sp)heardBack();}
};
let viaMic=false,wakeOn=false,appListening=false,cmdNext=false;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null;
function micState(on){$('mic').textContent=on?'🎙':'🎤';$('ms').textContent=on?'Mic ON':'Mic off';$('ms').className=on?'bad':'ok';pv();}
$('mic').onclick=()=>{
  if(priv)return;
  if(!SR){if(appEars()){if(appListening){JarvisApp.stopListen();appListening=false;micState(false);}else{appListening=true;micState(true);JarvisApp.listen($('lang').value,false);}}else add('err','Voice input is not available here. Use Chrome.');return;}
  if(rec){rec.stop();return;}
  rec=new SR();rec.lang=$('lang').value;rec.interimResults=false;
  rec.onresult=e=>{$('msg').value=e.results[0][0].transcript;viaMic=true;$('f').requestSubmit();};
  rec.onerror=e=>add('err','Mic error: '+e.error);
  rec.onend=()=>{rec=null;micState(false);};
  micState(true);rec.start();
};
const appEars=()=>!!(window.JarvisApp&&JarvisApp.listen);
const WAKE=/(?:jarvis|jarvish|जार्विस|जारविस|जार्विश)[\s,.!?]*(.*)$/i;
const heardBack=()=>{if(!appEars()||priv)return;
  if(cmdNext){cmdNext=false;appListening=true;micState(true);JarvisApp.listen($('lang').value,false);}
  else if(wakeOn)JarvisApp.listen($('lang').value,true);};
function wakeBtn(){$('wake').hidden=!appEars();$('wake').textContent='Hey Jarvis: '+(wakeOn?'on':'off');
  if(wakeOn)$('ms').textContent='Waiting for "Hey Jarvis"';else if(!rec&&!appListening)micState(false);}
$('wake').onclick=()=>{
  if(priv){add('err','Privacy mode is on. Tap "Turn mic on" first.');return;}
  wakeOn=!wakeOn;
  if(wakeOn){JarvisApp.listen($('lang').value,true);add('bot','Hey Jarvis is on while this app stays open. Say "Hey Jarvis" and then your question. The phone speech service listens, so it may beep and use more battery. Say "Jarvis, stop listening" or tap the button to turn it off.');}
  else JarvisApp.stopListen();
  wakeBtn();pv();};
const heardSend=t=>{if(wakeOn)JarvisApp.stopListen();viaMic=true;$('msg').value=t;$('f').requestSubmit();};
window.onHeard=(txt,wake)=>{txt=(txt||'').trim();
  if(wake){const m=txt.match(WAKE);if(!m)return;const cmd=m[1].trim();
    if(cmd.length>1){heardSend(cmd);return;}
    cmdNext=true;JarvisApp.stopListen();speak(sty()=='hindi'?'जी सर?':'Yes sir?',true);return;}
  appListening=false;micState(false);if(txt)heardSend(txt);else add('err','I did not hear anything.');};
window.onHeardErr=txt=>{appListening=false;wakeOn=false;cmdNext=false;micState(false);wakeBtn();add('err','Mic: '+txt);};
$('stop').onclick=()=>{if(rec)rec.abort();if(appEars()){JarvisApp.stopListen();wakeOn=false;appListening=false;wakeBtn();}speechSynthesis.cancel();if(aud)aud.pause();micState(false);};
const NV=[['hi-IN-MadhurNeural','Jarvis Hindi (Madhur)'],['en-GB-RyanNeural','Jarvis English (Ryan)'],['en-IN-PrabhatNeural','Indian male (Prabhat)'],['en-IN-NeerjaNeural','Indian female (Neerja)'],['hi-IN-SwaraNeural','Hindi female (Swara)']];
let aud=null,warned=false,fx=['d','b'].includes(localStorage.getItem('jpre'));
let actx=null;
function studio(el){ // deep, clean "assistant" tone: more bass, softer top, gentle compressor. If anything fails the sound stays normal.
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume();
    const lo=actx.createBiquadFilter(),hi=actx.createBiquadFilter(),cp=actx.createDynamicsCompressor();
    lo.type='lowshelf';lo.frequency.value=200;lo.gain.value=6;hi.type='highshelf';hi.frequency.value=6500;hi.gain.value=-4;
    const s=actx.createMediaElementSource(el);s.connect(lo);lo.connect(hi);hi.connect(cp);cp.connect(actx.destination);}catch(e){}
}
function loadVoices(){
  const rk=v=>{const l=v.lang.replace('_','-').toLowerCase();return l=='en-in'?0:l=='hi-in'?1:l.startsWith('en')?2:3;};
  const vs=speechSynthesis.getVoices().sort((a,b)=>rk(a)-rk(b));
  $('voice').innerHTML=NV.map(([id,n])=>`<option value="neural:${id}">⭐ ${n} (net)</option>`).join('')+vs.map(v=>`<option value="${v.name}">${v.name} (${v.lang})</option>`).join('');
  const want=localStorage.getItem('jvoice')||'';$('voice').value=want;
  if(!want||$('voice').value!==want)$('voice').value='neural:hi-IN-MadhurNeural'; // old saved voice no longer in the list
}
async function neural(t,v){
  const r=await fetch('/tts',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({text:t,voice:v,pitch:Math.round(($('pt').value-1)*100),rate:Math.round(($('rt').value-1)*100)})});
  if(!r.ok){let e={};try{e=await r.json()}catch(x){}throw new Error(e.error||'voice error');}
  if(aud)aud.pause();aud=new Audio(URL.createObjectURL(await r.blob()));aud.playbackRate=+$('rt').value;if(fx)studio(aud);aud.onended=aud.onerror=heardBack;await aud.play();
}
function local(t){
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.pitch=+$('pt').value;u.rate=+$('rt').value;
  const v=speechSynthesis.getVoices().find(x=>x.name==$('voice').value)||speechSynthesis.getVoices().find(x=>/en.GB|en.IN/i.test(x.lang));
  if(v){u.voice=v;u.lang=v.lang;}else u.lang='en-IN';u.onend=u.onerror=heardBack;speechSynthesis.speak(u);
}
async function speak(t,force){
  if(!force&&!$('say').checked)return;if(wakeOn&&appEars())JarvisApp.stopListen();const v=$('voice').value||'neural:hi-IN-MadhurNeural';
  if(v.startsWith('neural:')){
    try{await neural(t,v.slice(7));return;}catch(e){add('err','Online voice failed: '+(e.name=='NotAllowedError'?'the browser blocked sound. Tap the page once and try again.':e.message)+'. Trying the phone voice.');}
  }
  if(window.speechSynthesis&&speechSynthesis.getVoices().length)local(t);
  else{heardBack();add('err','No voice on this phone. Install a text-to-speech voice in Android settings, or fix the online voice (pip install edge-tts, internet on).');}
}
if(window.speechSynthesis){speechSynthesis.onvoiceschanged=loadVoices;loadVoices();}
$('say').checked=localStorage.getItem('jsay')=='1';$('lang').value=localStorage.getItem('jlang')||'hi-IN';
$('say').onchange=()=>localStorage.setItem('jsay',$('say').checked?'1':'0');
$('voice').onchange=()=>localStorage.setItem('jvoice',$('voice').value);
$('pt').value=localStorage.getItem('jpt')||'0.7';$('rt').value=localStorage.getItem('jrt')||'0.92';
$('pt').onchange=()=>localStorage.setItem('jpt',$('pt').value);$('rt').onchange=()=>localStorage.setItem('jrt',$('rt').value);
$('tv').onclick=()=>speak($('voice').value.includes('hi-IN')?'नमस्ते सर, मैं जार्विस हूँ। बताइए, मैं आपकी क्या सेवा कर सकता हूँ?':'Hello sir, I am Jarvis. How can I help you?',true);
$('lang').onchange=()=>localStorage.setItem('jlang',$('lang').value);
function row(p){
  const r=document.createElement('div');r.className='kr';const l=document.createElement('span');
  l.textContent=(p.saved?'✅ ':'⬜ ')+p.name+(p.saved?' '+p.masked:'');r.appendChild(l);
  if(p.saved)[['Test',async()=>{l.textContent='⏳ '+p.name;const {d}=await api('/keys/test',{provider:p.name});l.textContent=(d.ok?'✅ ':'❌ ')+p.name+(d.ok?' works':' '+d.error);}],
    ['Remove',async()=>{await api('/keys/delete',{provider:p.name});keys();}]].forEach(([n,f])=>{const b=document.createElement('button');b.textContent=n;b.onclick=f;r.appendChild(b);});
  return r;
}
async function keys(){const {d}=await api('/keys');$('kl').textContent='';(d.providers||[]).forEach(p=>$('kl').appendChild(row(p)));}
async function mem(){
  const {d}=await api('/memory');const L=$('ml');L.textContent='';const a=d.memories||[];
  if(!a.length)L.textContent='Nothing saved yet. Type in chat: remember this: ...';
  a.forEach(m=>{const r=document.createElement('div');r.className='kr';const l=document.createElement('span');l.textContent='#'+m.id+' '+m.text;
    const b=document.createElement('button');b.textContent='Remove';b.onclick=async()=>{await api('/memory/delete',{id:m.id});mem();};r.append(l,b);L.appendChild(r);});
}
async function ppl(){
  const {d}=await api('/people');const L=$('pl');L.textContent='';const a=d.people||[];
  if(!a.length){L.textContent='No people yet. Type in chat: note about Faisal: old friend';return;}
  a.forEach(p=>{const r=document.createElement('div');r.className='kr';const l=document.createElement('span');l.textContent=p.name+': '+p.notes.join('; ');
    const b=document.createElement('button');b.className='g';b.textContent='Remove';b.onclick=async()=>{await api('/people/delete',{name:p.name});ppl();};r.append(l,b);L.appendChild(r);});
}
const SLOW=/phone (?:is )?(?:slow|hang|lag)|why is my phone|phone health|phone check|slow phone|फ़ोन धीमा|फोन धीमा/i;
const pinfo=()=>{try{return window.JarvisApp&&JarvisApp.phoneInfo?JSON.parse(JarvisApp.phoneInfo()):null}catch(e){return null}};
const CALLQ=/missed calls?|who called|recent calls|call history|call log|मिस्ड कॉल|किसका कॉल/i,CNQ=/^\s*(?:find contact|contact number of|contact for|contact)\s+(.{1,40}?)\s*\??\s*$/i;
const bridge=(f,a)=>{try{return window.JarvisApp&&JarvisApp[f]?JSON.parse(JarvisApp[f](a)):null}catch(e){return null}};
const SCREENQ=/(?:read|explain|summari[sz]e|what(?:'s| is) on)\s+(?:my |this |the )?screen|screen (?:read|check)|मेरी स्क्रीन|स्क्रीन पढ़/i;
let screenData=null,pendingMsg=null;
const sbridge=()=>{try{return window.JarvisApp&&JarvisApp.screen?JSON.parse(JarvisApp.screen()):null}catch(e){return null}};
window.onScreen=s=>{if(!pendingMsg)return;try{screenData=JSON.parse(s)}catch(e){screenData={error:'could not read the screen'}}$('msg').value=pendingMsg;pendingMsg=null;$('f').requestSubmit();};
const WHERE=/where am i|my location|near me|nearby|around me|nearest|mere paas|मैं कहाँ हूँ|मेरे पास/i;
const getLoc=()=>new Promise(ok=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>ok({lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy}),()=>ok(null),{enableHighAccuracy:true,timeout:15000}):ok(null));
async function shrink(file){
  const im=await createImageBitmap(file);const k=Math.min(1,1024/Math.max(im.width,im.height));
  const cv=document.createElement('canvas');cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);

}

const DASH=[['mic','Microphone','Voice input, only after you tap the mic','app'],['wake','Hey Jarvis','Wake word, only while the app is open','app'],['camera','Camera and photos','Android photo picker, only when you tap the camera button',''],['screen','Screen reader','Needs the Jarvis accessibility switch. Reads text only when you ask','acc'],['location','Location','Only when you ask where you are','app'],['contacts','Contacts','Only when you ask for a contact','app'],['calls','Call log','Only when you ask for calls','app'],['notify','Reminders and notifications','Reminders show even when the app is closed','notif'],['battery','Battery limit','Android may stop Jarvis in the background to save battery','battery'],['apps','Phone control (open apps)','Opens an app only when you ask and the switch is ON. App names stay on the phone','']];
const ago=t=>{if(!t)return 'never';const m=Math.round((Date.now()-t)/60000);return m<1?'just now':m<60?m+' min ago':m<1440?Math.round(m/60)+' h ago':Math.round(m/1440)+' days ago';};
function dash(){
  const box=$('dash');let d=null;try{d=window.JarvisApp&&JarvisApp.dashboard?JSON.parse(JarvisApp.dashboard()):null}catch(e){}

  box.appendChild(el('p','',srvUp?'Server: online for '+(srvUp<3600?Math.round(srvUp/60)+' min':Math.round(srvUp/3600)+' h'):'Server: offline'));
  if(!d){box.appendChild(el('p','','Permission status is shown in the Jarvis Android app. In Chrome the browser controls the microphone and location.'));return;}
  box.appendChild(el('p',d.stopped?'bad':'ok',d.stopped?'🔒 Jarvis is STOPPED. Nothing listens or reads.':'🟢 Jarvis is active. It listens or reads only when you ask.'));
  const b=el('button','g',d.stopped?'Turn mic on':'Stop everything');b.onclick=()=>{if(d.stopped)$('mon').click();else add('bot',stopAll());setTimeout(dash,400);};box.appendChild(b);
  const pc=el('div','dr');pc.appendChild(el('b','','Phone control'));pc.appendChild(el('small','','Lets Jarvis open apps when you ask. OFF by default. Only a finger tap can turn it on. Stop everything turns it off.'));

  pc.appendChild(cb);box.appendChild(pc);
  const nm={};
  DASH.forEach(([id,name,why,go])=>{nm[id]=name;const p=d.perm[id],r=el('div','dr');r.appendChild(el('b','',name));r.appendChild(el('small','',why));
    const L=id=='battery'?['Limited by Android','Not limited']:id=='screen'?['Accessibility OFF','Accessibility ON']:['Not allowed','Allowed'];

    if(id!='battery')r.appendChild(el('span','chip '+(d.run[id]?'warn':''),id=='notify'?(d.run[id]?'Reminder service ON':'Reminder service OFF'):d.run[id]?'RUNNING NOW':'Not running'));
    if(id!='battery')r.appendChild(el('span','chip','Last used: '+ago(d.last[id])));
    if(p==0){const g=el('button','g','Open settings');g.onclick=()=>JarvisApp.openSettings(go);r.appendChild(g);}
    box.appendChild(r);});
  box.appendChild(el('small','','Recent activity (feature and time only, nothing private is saved):'));
  const lg=(d.log||[]).slice(-8).reverse();box.appendChild(el('div','',lg.length?lg.map(x=>(nm[x[0]]||x[0])+' · '+new Date(x[1]).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})).join('\n'):'Nothing yet.'));box.lastChild.style.whiteSpace='pre-line';
}

const GB=b=>(b/1073741824).toFixed(1)+' GB',MB=b=>Math.round(b/1048576)+' MB';
async function sysCard(){
  const box=$('sys');if(!box||$('set').hidden)return;
  let sv={};try{const {s,d}=await api('/stats');if(s==200)sv=d;}catch(e){box.textContent='Server offline: no numbers.';return;}
  const ph=pinfo()||{},m=ph.ram_total?ph:sv,rows=[];
  const bar=(n,p,t)=>{const r=el('div','kr'),b=el('div','bar'),i=el('i',p>=90?'b':p>=75?'w':'');i.style.width=Math.max(0,Math.min(100,p))+'%';b.appendChild(i);r.append(el('span',null,n),b,el('b',null,t));rows.push(r);};
  const txt=(n,t)=>{const r=el('div','kr');r.append(el('span',null,n),el('b',null,t));rows.push(r);};
  if(m.ram_total){const u=m.ram_total-m.ram_free;bar('Phone RAM',100*u/m.ram_total,GB(u)+' / '+GB(m.ram_total));}else txt('Phone RAM','not available');
  if(m.disk_total||sv.disk_total){const d=m.disk_total?m:sv,u=d.disk_total-d.disk_free;bar('Storage',100*u/d.disk_total,GB(u)+' / '+GB(d.disk_total));}
  if(ph.battery!=null)bar('Battery'+(ph.charging?' (charging)':''),ph.battery,ph.battery+'%');else txt('Battery','open the Jarvis app to see it');
  if(ph.temp_c)bar('Battery heat',100*(ph.temp_c-20)/30,ph.temp_c+' °C');
  if(sv.srv_ram)txt('Jarvis server memory',MB(sv.srv_ram));
  if(sv.srv_cpu!=null&&sv.srv_cpu!==undefined)bar('Jarvis server CPU',sv.srv_cpu,sv.srv_cpu+'% of one core');
  if(sv.load)txt('Phone load (1/5/15 min)',sv.load.join(' / '));
  txt('Internet',navigator.onLine?'online':'offline');
  if(srvUp)txt('Server running',Math.floor(srvUp/60)+' min');
  box.replaceChildren(...rows);
}
