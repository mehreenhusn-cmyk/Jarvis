<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="google" content="notranslate"><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#2563eb">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jarvis</title>
<style>
:root{--bg:#f4f5f7;--fg:#15171a;--card:#fff;--me:#d9e8ff;--line:#d5d8dd;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#0f1114;--fg:#e8eaed;--card:#1a1d21;--me:#1f3550;--line:#2b2f35}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px system-ui,sans-serif;height:100dvh;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:600}
#st{font-weight:400;font-size:14px}.ok{color:#1a9c4a}.warn{color:#c98a00}.bad{color:#d33}
#pair{padding:20px}#pair input,#chat input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);font-size:16px}
button{padding:12px 16px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-size:16px}
#log{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.m{max-width:85%;padding:10px 12px;border-radius:12px;background:var(--card);white-space:pre-wrap;word-wrap:break-word}
.m.user{align-self:flex-end;background:var(--me)}.m.err{color:#d33}
#chat{flex:1;display:flex;flex-direction:column;min-height:0}#chat[hidden],#pair[hidden]{display:none}
form{display:flex;gap:6px;padding:10px;border-top:1px solid var(--line)}
.bar{display:flex;gap:8px;padding:6px 10px;flex-wrap:wrap;align-items:center;font-size:14px;border-bottom:1px solid var(--line)}
select{max-width:48%;padding:6px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
#stop{background:#d33}
#gear{padding:2px 8px;background:none;color:var(--fg);font-size:20px}
#set{padding:14px;overflow-y:auto;flex:1}#set[hidden]{display:none}
.kr{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 0}.kr button{padding:4px 10px;font-size:14px}
</style></head><body>
<header><span>Jarvis</span><span><button id="gear">⚙</button> <span id="st">...</span></span></header>
<div id="pair"><p>Termux mein jo 6-digit <b>PAIRING CODE</b> dikha, wo yahan daalo:</p>
<input id="code" inputmode="numeric" maxlength="6" placeholder="123456"><p><button id="go">Pair karo</button></p><p id="pe" class="bad"></p></div>
<div id="set" hidden><p><b>API key daalo</b>: copy karke paste karo. Jarvis khud pehchanega kis company ki hai aur check karega.</p>
<input id="key" placeholder="key yahan paste karo" autocomplete="off"><p><button id="kp">📋 Clipboard se paste</button> <button id="kc">Check karo</button></p><p id="kr"></p><div id="kl"></div></div>
<div id="chat" hidden>
<div class="bar"><select id="lang"><option value="hi-IN">Bolna: Hindi/Hinglish</option><option value="en-IN">Bolna: English</option></select>
<select id="voice"></select><label><input type="checkbox" id="say"> bolkar jawab</label><b id="ms" class="ok">Mic band</b>
<label>Gehra <input type="range" id="pt" min="0.5" max="1.5" step="0.05" style="width:70px"></label><label>Speed <input type="range" id="rt" min="0.6" max="1.4" step="0.05" style="width:70px"></label><button type="button" id="tv" style="padding:6px 10px">🔊 test</button></div>
<div id="log"></div>
<form id="f"><button type="button" id="mic">🎤</button><input id="msg" autocomplete="off" placeholder="Kuch bolo..."><button>Bhejo</button><button type="button" id="stop">⏹</button></form></div>
<script>
const $=id=>document.getElementById(id);
let token=localStorage.getItem('jtoken')||'';
async function api(path,body){
  const h={'Content-Type':'application/json'};if(token)h.Authorization='Bearer '+token;
  const r=await fetch(path,{method:body?'POST':'GET',headers:h,body:body?JSON.stringify(body):undefined});
  let d={};try{d=await r.json()}catch(e){}
  return {s:r.status,d};
}
function add(role,text){const m=document.createElement('div');m.className='m '+role;m.textContent=text;$('log').appendChild(m);m.scrollIntoView();return m;}
function show(){$('pair').hidden=!!token;$('chat').hidden=!token;if(!token)$('set').hidden=true;}
async function ping(){
  try{const {d}=await api('/status');
    $('st').textContent=d.configured?'● online':'● online (API key .env mein nahi)';$('st').className=d.configured?'ok':'warn';
  }catch(e){$('st').textContent='● server offline';$('st').className='bad';}
}
async function history(){
  $('log').textContent='';
  try{const {s,d}=await api('/history');if(s==200)d.messages.forEach(m=>add(m.role,m.content));}catch(e){}
}
$('go').onclick=async()=>{
  try{const {s,d}=await api('/pair',{code:$('code').value.trim(),name:'phone browser'});
    if(s==200){token=d.token;localStorage.setItem('jtoken',token);show();history();}else $('pe').textContent=d.error||'pair nahi hua';
  }catch(e){$('pe').textContent='Server se connect nahi hua. Termux mein app.py chal raha hai?';}
};
$('f').onsubmit=async e=>{
  e.preventDefault();const t=$('msg').value.trim();if(!t)return;$('msg').value='';
  if(/^(gsk_|sk-or-|nvapi-|mstrl_|sk-[0-9a-f]{32}$)/.test(t)){$('set').hidden=false;$('chat').hidden=true;$('key').value=t;addKey();return;}
  add('user',t);const w=add('bot','...');
  try{const {s,d}=await api('/chat',{message:t});
    if(s==401){token='';localStorage.removeItem('jtoken');show();return;}
    if(s==200){w.textContent=d.reply;w.title='via '+d.via;speak(d.reply);}else{w.className='m err';w.textContent=d.error||'error';}
  }catch(e){w.className='m err';w.textContent='Server se connect nahi hua.';}
};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null;
function micState(on){$('mic').textContent=on?'🎙':'🎤';$('ms').textContent=on?'Mic CHALU':'Mic band';$('ms').className=on?'bad':'ok';}
$('mic').onclick=()=>{
  if(!SR){add('err','Is browser mein voice input nahi hai. Chrome use karo.');return;}
  if(rec){rec.stop();return;}
  rec=new SR();rec.lang=$('lang').value;rec.interimResults=false;
  rec.onresult=e=>{$('msg').value=e.results[0][0].transcript;$('f').requestSubmit();};
  rec.onerror=e=>add('err','Mic error: '+e.error);
  rec.onend=()=>{rec=null;micState(false);};
  micState(true);rec.start();
};
$('stop').onclick=()=>{if(rec)rec.abort();speechSynthesis.cancel();if(aud)aud.pause();micState(false);};
const NV=[['en-GB-RyanNeural','Jarvis British (Ryan)'],['en-IN-PrabhatNeural','Indian male (Prabhat)'],['hi-IN-MadhurNeural','Hindi male (Madhur)'],['en-IN-NeerjaNeural','Indian female (Neerja)'],['hi-IN-SwaraNeural','Hindi female (Swara)']];
let aud=null,warned=false;
function loadVoices(){
  const rk=v=>{const l=v.lang.replace('_','-').toLowerCase();return l=='en-in'?0:l=='hi-in'?1:l.startsWith('en')?2:3;};
  const vs=speechSynthesis.getVoices().sort((a,b)=>rk(a)-rk(b));
  $('voice').innerHTML=NV.map(([id,n])=>`<option value="neural:${id}">⭐ ${n} (net)</option>`).join('')+vs.map(v=>`<option value="${v.name}">${v.name} (${v.lang})</option>`).join('');
  $('voice').value=localStorage.getItem('jvoice')||'neural:en-GB-RyanNeural';
}
async function neural(t,v){
  const r=await fetch('/tts',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({text:t,voice:v})});
  if(!r.ok){let e={};try{e=await r.json()}catch(x){}throw new Error(e.error||'awaaz error');}
  if(aud)aud.pause();aud=new Audio(URL.createObjectURL(await r.blob()));aud.playbackRate=+$('rt').value;await aud.play();
}
function local(t){
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.pitch=+$('pt').value;u.rate=+$('rt').value;
  const v=speechSynthesis.getVoices().find(x=>x.name==$('voice').value)||speechSynthesis.getVoices().find(x=>/en.GB|en.IN/i.test(x.lang));
  if(v){u.voice=v;u.lang=v.lang;}else u.lang='en-IN';speechSynthesis.speak(u);
}
async function speak(t,force){
  if(!force&&!$('say').checked)return;const v=$('voice').value;
  if(v.startsWith('neural:')){
    try{await neural(t,v.slice(7));return;}catch(e){if(!warned){warned=true;add('err','Net-awaaz nahi chali ('+e.message+'). Phone ki awaaz use ho rahi hai.');}}
  }
  if(window.speechSynthesis)local(t);
}
if(window.speechSynthesis){speechSynthesis.onvoiceschanged=loadVoices;loadVoices();}
$('say').checked=localStorage.getItem('jsay')=='1';$('lang').value=localStorage.getItem('jlang')||'hi-IN';
$('say').onchange=()=>localStorage.setItem('jsay',$('say').checked?'1':'0');
$('voice').onchange=()=>localStorage.setItem('jvoice',$('voice').value);
$('pt').value=localStorage.getItem('jpt')||'0.8';$('rt').value=localStorage.getItem('jrt')||'0.95';
$('pt').onchange=()=>localStorage.setItem('jpt',$('pt').value);$('rt').onchange=()=>localStorage.setItem('jrt',$('rt').value);
$('tv').onclick=()=>speak('Namaste, main Jarvis hoon. Bataiye, kya kaam hai?',true);
$('lang').onchange=()=>localStorage.setItem('jlang',$('lang').value);
function row(p){
  const r=document.createElement('div');r.className='kr';const l=document.createElement('span');
  l.textContent=(p.saved?'✅ ':'⬜ ')+p.name+(p.saved?' '+p.masked:'');r.appendChild(l);
  if(p.saved)[['test',async()=>{l.textContent='⏳ '+p.name;const {d}=await api('/keys/test',{provider:p.name});l.textContent=(d.ok?'✅ ':'❌ ')+p.name+(d.ok?' chal rahi hai':' '+d.error);}],
    ['hatao',async()=>{await api('/keys/delete',{provider:p.name});keys();}]].forEach(([n,f])=>{const b=document.createElement('button');b.textContent=n;b.onclick=f;r.appendChild(b);});
  return r;
}
async function keys(){const {d}=await api('/keys');$('kl').textContent='';(d.providers||[]).forEach(p=>$('kl').appendChild(row(p)));}
async function addKey(){
  const k=$('key').value.trim();if(!k)return;$('kr').className='';$('kr').textContent='⏳ check ho raha hai...';
  try{const {d}=await api('/keys',{key:k});
    if(d.ok){$('kr').className='ok';$('kr').textContent='✅ '+d.provider+' ki key sahi hai, save ho gayi ('+d.masked+')';$('key').value='';keys();ping();}
    else{$('kr').className='bad';$('kr').textContent='❌ '+(d.provider?d.provider+': ':'')+d.error;}
  }catch(e){$('kr').className='bad';$('kr').textContent='Server se connect nahi hua';}
}
$('kc').onclick=addKey;$('key').onpaste=()=>setTimeout(addKey,150);
$('kp').onclick=async()=>{try{$('key').value=await navigator.clipboard.readText();addKey();}catch(e){$('kr').textContent='Clipboard allow nahi hua, box mein long-press karke paste karo';}};
$('gear').onclick=()=>{if(!token)return;$('set').hidden=!$('set').hidden;$('chat').hidden=!$('set').hidden;if(!$('set').hidden)keys();};
show();ping();setInterval(ping,5000);if(token)history();
</script></body></html>
